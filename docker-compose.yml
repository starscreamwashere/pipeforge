# PipeForge local environment (Technical Requirements §16).
# Core data services (postgres, redis) plus management UIs and Prometheus.
# Values fall back to sane defaults so the stack boots without a .env file;
# copy .env.example -> .env to override.
name: pipeforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: pipeforge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pipeforge}
      POSTGRES_USER: ${DB_USERNAME:-pipeforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pipeforge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pipeforge} -d ${DB_NAME:-pipeforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pipeforge-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pipeforge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pipeforge.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: pipeforge-redisinsight
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pipeforge-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  pipeforge-app:
    build: ./backend
    container_name: pipeforge-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pipeforge}
      DB_USERNAME: ${DB_USERNAME:-pipeforge}
      DB_PASSWORD: ${DB_PASSWORD:-pipeforge}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONSUMER_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789abcdef}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
