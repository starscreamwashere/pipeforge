# PipeForge local environment (Technical Requirements §16).
# Core data services (postgres, redis) plus management UIs and Prometheus.
# Values fall back to sane defaults so the stack boots without a .env file;
# copy .env.example -> .env to override.
name: pipeforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: pipeforge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pipeforge}
      POSTGRES_USER: ${DB_USERNAME:-pipeforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pipeforge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pipeforge} -d ${DB_NAME:-pipeforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pipeforge-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pipeforge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pipeforge.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: pipeforge-redisinsight
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pipeforge-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # The application service is enabled in Milestone 10 (Deployment Readiness),
  # once backend/Dockerfile exists. Kept here as documentation of the target topology.
  # pipeforge-app:
  #   build: ./backend
  #   container_name: pipeforge-app
  #   env_file: .env
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  pgdata:
  redisdata:
