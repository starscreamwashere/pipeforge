# Production profile. All sensitive values MUST come from the environment.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  # Structured JSON logs (Technical Requirements §14) for searchable aggregation.
  # ECS includes timestamp, level, logger, message, and MDC fields (e.g. taskRunId).
  structured:
    format:
      console: ecs
  level:
    com.pipeforge: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
